stages:
  - test

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements-dev.txt
  script:
    - pytest --cov=plugins/module_utils --cov=plugins/modules --cov-branch --cov-report=term-missing --cov-fail-under=100
  coverage: '/TOTAL.*\s+(\d+%)/'
  rules:
    - if: $CI_PIPELINE_SOURCE
